<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Learning Lesson</title>
</head>
<body>

    <!-- Header Section -->
    <a href="index.html">Return Home</a>
    <header>
        <h1 lang="es">¡Hola! - Spanish Lesson 1</h1>
        <p>Welcome to your daily vocabulary and phrase practice.</p>
    </header>

    <!-- Vocabulary Section -->
    <section>
        <h2>Core Vocabulary</h2>
        <ul>
            <li lang="es"><strong>Buenos días</strong> — Good morning</li>
            <li lang="es"><strong>Por favor</strong> — Please</li>
            <li lang="es"><strong>Gracias</strong> — Thank you</li>
        </ul>
    </section>

    <!-- Interactive / Practice Section -->
    <section>
        <h2>Quick Practice</h2>
        <p>Translate the following phrase into Spanish:</p>
        <p><em>"Good morning"</em></p>
        <form>
            <input type="text" placeholder="Type your answer here..." required>
            <button type="submit">Check Answer</button>
        </form>
    </section>

    <!-- Audio / Media Section -->
    <section>
        <h2>Listening Exercise</h2>
        <audio controls>
            <source src="audio-sample.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </section>
    </section>

</body>
</html>
